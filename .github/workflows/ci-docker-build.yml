name: CI (Docker build on PR)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: dummy:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
