<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <title>LEL Steel - Fabrication Management System</title>
    
    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LEL Steel" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Professional steel fabrication management system with cutting optimization, AI estimation, and project tracking for Lateral Engineering Limited" />
    <meta name="keywords" content="steel fabrication, cutting optimization, project management, estimation, inventory tracking" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Fallback for environments without module support -->
    <script nomodule>
      console.log('Module scripts not supported, loading fallback...');
      document.getElementById('root').innerHTML = '<div style="padding: 2rem; text-align: center;"><h2>LEL Steel</h2><p>Loading application in compatibility mode...</p><p>Please wait while the application loads...</p></div>';
      // Reload with module polyfill
      setTimeout(function() {
        if (!window.React) {
          window.location.reload();
        }
      }, 3000);
    </script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
