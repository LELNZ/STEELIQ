<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEL Steel - Loading...</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .loader-container {
        text-align: center;
        padding: 2rem;
      }
      .logo {
        font-size: 2rem;
        font-weight: bold;
        color: #1e40af;
        margin-bottom: 2rem;
      }
      .spinner {
        display: inline-block;
        width: 50px;
        height: 50px;
        border: 4px solid #e5e7eb;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .message {
        margin-top: 1rem;
        color: #6b7280;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .error {
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 0.5rem;
        padding: 1rem;
        margin-top: 2rem;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="loader-container">
      <div class="logo">LEL Steel</div>
      <div class="spinner"></div>
      <div class="message">Loading application...</div>
    </div>
    
    <script>
      // Check if we're in preview pane
      const isPreviewPane = window.location.host.includes('replit.dev') && window.parent !== window;
      
      if (isPreviewPane) {
        // In preview pane, wait a moment then try to load the app
        setTimeout(function() {
          // Create an iframe to load the app
          const iframe = document.createElement('iframe');
          iframe.style.position = 'fixed';
          iframe.style.top = '0';
          iframe.style.left = '0';
          iframe.style.width = '100%';
          iframe.style.height = '100%';
          iframe.style.border = 'none';
          iframe.src = window.location.href + '?module=true';
          
          iframe.onerror = function() {
            document.querySelector('.message').innerHTML = 
              'Unable to load in preview pane. <a href="' + window.location.href + '" target="_blank">Open in new tab</a>';
          };
          
          document.body.innerHTML = '';
          document.body.appendChild(iframe);
        }, 1000);
      } else {
        // Not in preview pane, redirect to main app
        window.location.replace('/');
      }
    </script>
  </body>
</html>
