<!DOCTYPE html>
<html>
<head>
    <title>Test</title>
</head>
<body>
    <h1>Test Page</h1>
    <div id="root">Root element exists</div>
    <script>
        console.log('Test script running');
        // Check if React app loaded
        setTimeout(() => {
            const root = document.getElementById('root');
            if (root && root.innerHTML === 'Root element exists') {
                console.error('React app did not mount!');
                document.body.innerHTML += '<p style="color: red;">React app failed to mount</p>';
            } else {
                console.log('React app mounted successfully');
            }
        }, 3000);
    </script>
</body>
</html>
